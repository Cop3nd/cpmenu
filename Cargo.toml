[package]
name = "cpmenu"
version = "0.5.0"
edition = "2024"
rust-version = "1.99"
description = "Cyberpunk 2077 quickhack-style Start menu replacement for Windows: apps, files, calculator, web search and plugins in one small exe"
license = "MIT"
readme = "README.md"
keywords = ["launcher", "start-menu", "windows", "cyberpunk", "direct2d"]
categories = ["gui", "os::windows-apis"]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml_edit = "0.25.17"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_Security", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_UI_Shell", "Win32_System_Com", "Win32_Storage_FileSystem", "Win32_System_DataExchange", "Win32_System_Power", "Win32_System_Shutdown", "Win32_System_Memory", "Win32_UI_HiDpi", "Win32_UI_Shell_Common", "Win32_System_Registry", "Win32_System_Search", "Win32_Globalization", "Win32_System_JobObjects", "Win32_Graphics_Imaging", "Win32_System_Console"] }
windows-numerics = "0.3.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
