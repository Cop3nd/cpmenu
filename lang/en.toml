# cpmenu UI strings. Every key is a stable id (table path + key, e.g. power.shutdown).
# Copy this file to %APPDATA%\cpmenu\lang\<code>.toml and translate it to add a language;
# keys you leave out fall back to English. Single entries can also be overridden from the
# [text] table of config.toml. {n} stands for a number.
# Color row names in the settings (settings.color.<table>.<key>, e.g. settings.color.row.border)
# default to the key name in capitals and are not listed here.

